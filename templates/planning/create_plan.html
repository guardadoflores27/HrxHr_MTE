<h2 class="text-2xl font-bold mb-6 text-gray-800">
  Create Daily Plan
</h2>

<form method="post"
      class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 space-y-5">

  {% csrf_token %}

  <div>
    <label class="block text-sm font-semibold text-gray-700 mb-1">
      Date
    </label>
    {{ form.date }}
  </div>

  <div>
    <label class="block text-sm font-semibold text-gray-700 mb-1">
      Work Center
    </label>
    {{ form.work_center }}
  </div>

  <div>
    <label class="block text-sm font-semibold text-gray-700 mb-1">
      SubProcess
    </label>
    {{ form.subprocess }}
  </div>

  <div>
    <label class="block text-sm font-semibold text-gray-700 mb-1">
      Headcount
    </label>
    {{ form.headcount }}
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Shift Start
      </label>
      {{ form.shift_start_time }}
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Shift End
      </label>
      {{ form.shift_end_time }}
    </div>

  </div>

  <button type="submit"
          class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2.5 rounded-lg transition">
    Save Plan
  </button>

</form>
