<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — MTE Hr×Hr</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Toast animation */
    @keyframes slideDown {
      from { transform: translateX(-50%) translateY(-80px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0);     opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(0);     opacity: 1; }
      to   { transform: translateX(-50%) translateY(-80px); opacity: 0; }
    }
    .toast-enter { animation: slideDown 0.35s cubic-bezier(.21,1.02,.73,1) forwards; }
    .toast-leave { animation: slideUp  0.3s ease-in forwards; }

    /* Shake on error */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.45s ease; }
  </style>
</head>
<body class="h-full bg-slate-900 flex items-center justify-center">

  {# ── Toast popup ── #}
  {% if form.errors %}
  <div id="toast"
       class="toast-enter fixed top-6 left-1/2 z-50
              flex items-center gap-3
              bg-red-600 text-white text-sm font-semibold
              px-5 py-3 rounded-xl shadow-2xl shadow-red-900/50
              border border-red-500/60 min-w-64 max-w-xs"
       style="transform: translateX(-50%);">
    <span class="flex-shrink-0 w-7 h-7 rounded-full bg-white/20 flex items-center justify-center">
      <i class="fas fa-lock text-xs"></i>
    </span>
    <div>
      <p class="leading-tight">Incorrect username or password.</p>
      <p class="text-red-200 text-xs font-normal mt-0.5">Please try again.</p>
    </div>
    <button onclick="dismissToast()" class="ml-auto text-red-200 hover:text-white transition flex-shrink-0">
      <i class="fas fa-xmark"></i>
    </button>
    {# Progress bar #}
    <div id="toast-bar"
         class="absolute bottom-0 left-0 h-1 bg-white/30 rounded-b-xl"
         style="width:100%; transition: width 4s linear;"></div>
  </div>
  {% endif %}

  <div class="w-full max-w-sm px-6">

    {# Logo #}
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center mb-4 shadow-lg shadow-blue-600/30">
        <i class="fas fa-industry text-white text-lg"></i>
      </div>
      <h1 class="text-white text-xl font-bold">MTE Hr×Hr</h1>
      <p class="text-slate-400 text-sm mt-1">Production Control System</p>
    </div>

    {# Card #}
    <div id="login-card" class="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl
         {% if form.errors %}border-red-700/60 shake{% endif %}">
      <p class="text-slate-200 text-base font-semibold mb-5">Sign in to your account</p>

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wide">Username</label>
            <input type="text" name="username" autofocus autocomplete="username"
                   class="w-full bg-slate-700 border text-slate-100 rounded-lg px-3 py-2.5 text-sm
                          focus:ring-1 focus:outline-none placeholder-slate-500
                          {% if form.errors %}border-red-500 focus:border-red-500 focus:ring-red-500
                          {% else %}border-slate-600 focus:border-blue-500 focus:ring-blue-500{% endif %}"
                   placeholder="your username">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wide">Password</label>
            <input type="password" name="password" autocomplete="current-password"
                   class="w-full bg-slate-700 border text-slate-100 rounded-lg px-3 py-2.5 text-sm
                          focus:ring-1 focus:outline-none placeholder-slate-500
                          {% if form.errors %}border-red-500 focus:border-red-500 focus:ring-red-500
                          {% else %}border-slate-600 focus:border-blue-500 focus:ring-blue-500{% endif %}"
                   placeholder="••••••••">
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit"
                class="mt-5 w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2.5 rounded-lg transition shadow-sm">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6 mono">MTE · Hora × Hora</p>
  </div>

{% if form.errors %}
<script>
  const toast    = document.getElementById('toast');
  const toastBar = document.getElementById('toast-bar');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => { toastBar.style.width = '0%'; });
  });

  const timer = setTimeout(dismissToast, 4000);

  function dismissToast() {
    clearTimeout(timer);
    toast.classList.remove('toast-enter');
    toast.classList.add('toast-leave');
    toast.addEventListener('animationend', () => toast.remove(), { once: true });
  }
</script>
{% endif %}

</body>
</html>
