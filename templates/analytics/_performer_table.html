{# Reusable performer ranking table. Params: title, table_id, info (tooltip text). Filled by JS. #}
<div class="bg-white rounded-xl border border-slate-200">
  <h3 class="rounded-t-xl text-sm font-semibold text-slate-700 px-5 py-3 border-b border-slate-100">{{ title }}{% if info %}{% include "analytics/_info.html" with text=info %}{% endif %}</h3>
  <div class="overflow-x-auto rounded-b-xl">
    <table class="min-w-full text-xs">
      <thead class="bg-slate-50 text-slate-500 uppercase">
        <tr>
          <th class="px-3 py-2 text-left" title="Work center or model being ranked.">Name</th>
          <th class="px-3 py-2 text-right" title="Pieces planned in the filtered scope.">Planned (pc)</th>
          <th class="px-3 py-2 text-right" title="Pieces actually produced in the filtered scope.">Actual (pc)</th>
          <th class="px-3 py-2 text-right" title="Actual pieces divided by planned pieces, times 100.">Productivity</th>
        </tr>
      </thead>
      <tbody id="{{ table_id }}" class="divide-y divide-slate-50">
        <tr><td colspan="4" class="px-3 py-4 text-center text-slate-400">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
