{# Reusable performer ranking table. Params: title, table_id. Filled by JS. #}
<div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
  <h3 class="text-sm font-semibold text-slate-700 px-5 py-3 border-b border-slate-100">{{ title }}</h3>
  <div class="overflow-x-auto">
    <table class="min-w-full text-xs">
      <thead class="bg-slate-50 text-slate-500 uppercase">
        <tr>
          <th class="px-3 py-2 text-left">Name</th>
          <th class="px-3 py-2 text-right">Planned (pc)</th>
          <th class="px-3 py-2 text-right">Actual (pc)</th>
          <th class="px-3 py-2 text-right">Productivity</th>
        </tr>
      </thead>
      <tbody id="{{ table_id }}" class="divide-y divide-slate-50">
        <tr><td colspan="4" class="px-3 py-4 text-center text-slate-400">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
