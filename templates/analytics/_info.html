{# Reusable inline info tooltip for chart/section titles. Param: text #}
<span class="group relative inline-flex items-center align-middle ml-1 cursor-help" title="{{ text }}">
  <i class="fas fa-circle-info text-[10px] text-slate-300 hover:text-slate-500 transition-colors"></i>
  <span class="pointer-events-none absolute left-1/2 -translate-x-1/2 bottom-full mb-2 z-30 w-64
               opacity-0 group-hover:opacity-100 transition-opacity duration-150">
    <span class="block rounded-lg bg-slate-800 text-white text-[11px] font-normal normal-case
                 tracking-normal leading-snug px-3 py-2 shadow-xl">{{ text }}</span>
  </span>
</span>
