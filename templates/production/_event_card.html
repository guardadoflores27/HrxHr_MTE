{# templates/production/_event_card.html #}
{# Renders one Operational Event as an independent card. Reused both for   #}
{# existing/bound forms and for the hidden <template> that JS clones when #}
{# "+ Add Event" is pressed.                                              #}
<div class="event-card border border-gray-200 rounded-lg px-3 py-2 bg-white shadow-sm" data-event-form>
  {{ ef.id }}
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <i class="fas {{ ef.instance.event_type.icon|default:'fa-circle-info' }} event-icon text-sm text-gray-400 flex-shrink-0"></i>
      <select name="{{ ef.event_type.html_name }}" id="{{ ef.event_type.auto_id }}"
              class="event-type-select text-xs font-semibold text-gray-700 border-0 bg-transparent
                     focus:outline-none focus:ring-0 p-0 cursor-pointer truncate">
        <option value="">Select event type…</option>
        {% for et in event_types %}
        <option value="{{ et.id }}" data-icon="{{ et.icon }}" data-requires-comment="{{ et.requires_comment|yesno:'1,0' }}"
                {% if ef.event_type.value|stringformat:"s" == et.id|stringformat:"s" %}selected{% endif %}>
          {{ et.name }}
        </option>
        {% endfor %}
      </select>
    </div>
    <button type="button" class="remove-event-btn text-gray-300 hover:text-red-500 transition flex-shrink-0"
            title="Delete event">
      <i class="fas fa-xmark"></i>
    </button>
    <span class="hidden">{{ ef.DELETE }}</span>
  </div>

  <div class="grid grid-cols-2 gap-2 mt-2">
    <div>
      <p class="text-[9px] text-gray-400 font-semibold uppercase tracking-wide mb-0.5">Duration (min)</p>
      <div class="flex items-center gap-1">
        {{ ef.duration_minutes }}
      </div>
    </div>
    <div>
      <p class="text-[9px] text-gray-400 font-semibold uppercase tracking-wide mb-0.5">
        Comment
        <span class="event-comment-required hidden text-red-500">*</span>
      </p>
      {{ ef.comment }}
    </div>
  </div>

  {% for err in ef.non_field_errors %}
  <p class="text-[10px] text-red-500 font-semibold mt-1">
    <i class="fas fa-circle-exclamation mr-1"></i>{{ err }}
  </p>
  {% endfor %}
</div>
